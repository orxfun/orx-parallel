# Updated workflow (based on .github/workflows/ci.yml at ref d04ad7abce0c67776a7189001f706535e3e5c402)
name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["stable"]
        features:
          [
            "",
            "--no-default-features",
            "--no-default-features --features std",
            "--no-default-features --features persistent-pool-rayon",
            "--no-default-features --features persistent-pool",
          ]

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-stable-${{ matrix.features || 'default' }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Install miri
        run: rustup component add --toolchain nightly-x86_64-unknown-linux-gnu miri

      - name: Build
        run: cargo build --verbose ${{ matrix.features }}

      - name: Test
        run: cargo test --verbose ${{ matrix.features }} --features long-tests

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings --verbose

      - name: Miri
        run: cargo +nightly miri test --lib --bins --tests --verbose ${{ matrix.features }} --features long-tests

  wasm:
    name: Check (wasm)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        wasm-features: ["--no-default-features --features wasm"]
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-nightly-wasm-${{ matrix.wasm-features || 'default' }}

      - name: Install nightly toolchain with wasm target and rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Check-wasm
        env:
          RUSTFLAGS: >-
            -C target-feature=+atomics,+bulk-memory,+mutable-globals
            -C link-arg=--shared-memory
            -C link-arg=--max-memory=1073741824
            -C link-arg=--import-memory
            -C link-arg=--export=__heap_base
            -C link-arg=--export=__wasm_init_tls
            -C link-arg=--export=__tls_size
            -C link-arg=--export=__tls_align
            -C link-arg=--export=__tls_base
        run: cargo +nightly check --verbose --target wasm32-unknown-unknown ${{ matrix.wasm-features }} -Z build-std=panic_abort,std

      - name: Build-wasm
        env:
          RUSTFLAGS: >-
            -C target-feature=+atomics,+bulk-memory,+mutable-globals
            -C link-arg=--shared-memory
            -C link-arg=--max-memory=1073741824
            -C link-arg=--import-memory
            -C link-arg=--export=__heap_base
            -C link-arg=--export=__wasm_init_tls
            -C link-arg=--export=__tls_size
            -C link-arg=--export=__tls_align
            -C link-arg=--export=__tls_base
        run: cargo +nightly build --verbose --target wasm32-unknown-unknown ${{ matrix.wasm-features }} -Z build-std=panic_abort,std

      - name: Test-wasm
        env:
          RUSTFLAGS: >-
            -C target-feature=+atomics,+bulk-memory,+mutable-globals
            -C link-arg=--shared-memory
            -C link-arg=--max-memory=1073741824
            -C link-arg=--import-memory
            -C link-arg=--export=__heap_base
            -C link-arg=--export=__wasm_init_tls
            -C link-arg=--export=__tls_size
            -C link-arg=--export=__tls_align
            -C link-arg=--export=__tls_base
        run: cargo +nightly test --verbose --target wasm32-unknown-unknown ${{ matrix.wasm-features }} -Z build-std=panic_abort,std --no-run

      - name: Clippy-wasm
        env:
          RUSTFLAGS: >-
            -C target-feature=+atomics,+bulk-memory,+mutable-globals
            -C link-arg=--shared-memory
            -C link-arg=--max-memory=1073741824
            -C link-arg=--import-memory
            -C link-arg=--export=__heap_base
            -C link-arg=--export=__wasm_init_tls
            -C link-arg=--export=__tls_size
            -C link-arg=--export=__tls_align
            -C link-arg=--export=__tls_base
        run: cargo +nightly clippy --target wasm32-unknown-unknown ${{ matrix.wasm-features }} -Z build-std=panic_abort,std -- -D warnings --verbose

      - name: Check-wasm-threads-example
        env:
          RUSTFLAGS: >-
            -C target-feature=+atomics,+bulk-memory
            -C link-arg=--shared-memory
            -C link-arg=--max-memory=1073741824
            -C link-arg=--import-memory
            -C link-arg=--export=__wasm_init_tls
            -C link-arg=--export=__tls_size
            -C link-arg=--export=__tls_align
            -C link-arg=--export=__tls_base
        run: |
          cargo +nightly check \
            --target wasm32-unknown-unknown \
            --features wasm \
            --example wasm_web_threads \
            -Z build-std=panic_abort,std

      - name: Check-wasm-threads-smoke-test
        env:
          RUSTFLAGS: >-
            -C target-feature=+atomics,+bulk-memory
            -C link-arg=--shared-memory
            -C link-arg=--max-memory=1073741824
            -C link-arg=--import-memory
            -C link-arg=--export=__wasm_init_tls
            -C link-arg=--export=__tls_size
            -C link-arg=--export=__tls_align
            -C link-arg=--export=__tls_base
        run: |
          cargo +nightly test \
            --target wasm32-unknown-unknown \
            --features wasm \
            --test wasm_web_threads_smoke \
            -Z build-std=panic_abort,std \
            --no-run

  wasm-hub:
    name: Build (wasm hub)
    runs-on: ubuntu-latest
    needs: wasm
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            examples/wasm/tsp/react/app/package-lock.json
            examples/wasm/tsp/yew/app/package-lock.json
            examples/wasm/tsp/leptos/app/package-lock.json
            examples/wasm/tsp/vanilla/app/package-lock.json

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-nightly-wasm-hub

      - name: Install nightly toolchain with wasm target and rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install app dependencies
        run: |
          for app in react yew leptos vanilla; do
            cd examples/wasm/tsp/$app/app
            npm ci
            cd -
          done

      - name: Build wasm packages for hub apps
        run: |
          for app in react yew leptos vanilla; do
            cd examples/wasm/tsp/$app/app
            npm run build:wasm
            cd -
          done

      - name: Build hub site
        run: |
          cd examples/wasm/tsp/hub
          bash ./build-hub.sh

      - name: Verify hub outputs
        run: |
          test -f examples/wasm/tsp/hub/site/index.html
          test -f examples/wasm/tsp/hub/site/apps/react/index.html
          test -f examples/wasm/tsp/hub/site/apps/yew/index.html
          test -f examples/wasm/tsp/hub/site/apps/leptos/index.html
          test -f examples/wasm/tsp/hub/site/apps/vanilla/index.html

  test-32:
    name: Test (i686)
    runs-on: ubuntu-latest
    needs: build
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-stable-i686

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Set up QEMU for multi-arch Docker
        uses: docker/setup-qemu-action@v2

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install cross
        run: cargo install --locked cross

      - name: Run tests for i686 target via cross
        run: |
          # Run unit tests under QEMU inside Docker so i686 test binaries are executed reliably.
          # Uses the glibc i686 target by default. Change to i686-unknown-linux-musl if you require musl.
          cross test --target i686-unknown-linux-gnu --verbose
