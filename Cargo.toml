[package]
name = "orx-parallel"
version = "4.0.0"
edition = "2024"
authors = ["orxfun <orx.ugur.arikan@gmail.com>"]
readme = "README.md"
description = "High performance, configurable and expressive parallel computation library."
license = "MIT OR Apache-2.0"
repository = "https://github.com/orxfun/orx-parallel/"
keywords = ["parallel", "concurrency", "performance", "thread", "iterator"]
categories = ["concurrency", "algorithms"]

[dependencies]
orx-iterable = { version = "1.3.0", default-features = false }
orx-pseudo-default = { version = "2.1.0", default-features = false }
orx-priority-queue = { version = "1.7.0", default-features = false }
orx-pinned-vec = { git = "https://github.com/orxfun/orx-pinned-vec", branch = "v4", default-features = false }
orx-fixed-vec = { git = "https://github.com/orxfun/orx-fixed-vec", branch = "v4", default-features = false }
orx-split-vec = { git = "https://github.com/orxfun/orx-split-vec", branch = "v4", default-features = false }
orx-concurrent-iter = { git = "https://github.com/orxfun/orx-concurrent-iter/", branch = "v4", default-features = false }
orx-concurrent-bag = { git = "https://github.com/orxfun/orx-concurrent-bag/", branch = "v4", default-features = false }
orx-concurrent-ordered-bag = { git = "https://github.com/orxfun/orx-concurrent-ordered-bag/", branch = "v4", default-features = false }
orx-pinned-concurrent-col = { git = "https://github.com/orxfun/orx-pinned-concurrent-col/", branch = "v3", default-features = false }
orx-concurrent-recursive-iter = { git = "https://github.com/orxfun/orx-concurrent-recursive-iter", branch = "v3", default-features = false }

# optional: thread pool
rayon-core = { version = "1.13.0", optional = true, default-features = false }

# wasm
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true, default-features = false }
js-sys = { version = "0.3", optional = true, default-features = false }

# wasm-experimental
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
wasm-bindgen-rayon = { version = "1.3", optional = true, default-features = false }

[dev-dependencies]
clap = { version = "4.6.5", features = ["derive"] }
orx-criterion = { git = "https://github.com/orxfun/orx-criterion" }
rand = { version = "0.10.2" }
rand_chacha = { version = "0.10" }
rayon = { version = "1.12.0" }
test-case = { version = "3.3.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["orx-concurrent-recursive-iter/std"]
experimental = []
long-tests = []
wasm = ["std", "dep:wasm-bindgen", "dep:js-sys"]
wasm-experimental = [
    "std",
    "rayon-core",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:wasm-bindgen-rayon",
]
persistent-pool = ["std"]
persistent-pool-rayon = ["std", "rayon-core"]


