<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WASM TSP Framework Switcher</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="panel" aria-label="Framework switcher">
      <div class="controls" role="tablist" aria-label="Framework pages">
        <button type="button" data-framework="vanilla">Vanilla</button>
        <button type="button" data-framework="react">React</button>
        <button type="button" data-framework="yew">Yew</button>
        <button type="button" data-framework="leptos">Leptos</button>
      </div>
      <p class="status" id="status">Click a button to open that framework app in this tab.</p>
      <p class="hint">
        Buttons open bundled pages under ./apps/<framework>/index.html.
        Use an http/https server, not file://.
      </p>
    </section>
  </main>

  <script type="module">
    const frameworkUrls = {
      vanilla: "./apps/vanilla/index.html",
      react: "./apps/react/index.html",
      yew: "./apps/yew/index.html",
      leptos: "./apps/leptos/index.html"
    };

    const buttons = Array.from(document.querySelectorAll("[data-framework]"));
    const status = document.getElementById("status");

    if (window.location.protocol === "file:") {
      status.textContent = "This hub cannot run from file://. Start a local server and open http://localhost:<port> instead.";
    }

    function loadFramework(framework) {
      const url = frameworkUrls[framework];
      if (!url) {
        status.textContent = "Unknown framework selection.";
        return;
      }
      status.textContent = `Loading ${framework} from ${url} ...`;
      window.location.href = url;
    }

    for (const button of buttons) {
      button.addEventListener("click", () => {
        const framework = button.dataset.framework;
        loadFramework(framework);
      });
    }
  </script>
</body>
</html>
