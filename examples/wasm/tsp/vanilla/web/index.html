<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>orx-parallel wasm tsp vanilla</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>WASM TSP, vanilla frontend</h1>
      <p>Run the same TSP workload sequentially or in parallel with a vanilla Vite + TypeScript UI.</p>

      <section class="card">
        <div id="runOverlay" class="run-overlay" aria-live="polite" aria-hidden="true">
          <div class="run-overlay-card">
            <div class="run-overlay-top">
              <span class="spinner" aria-hidden="true"></span>
              <p id="runTitle" class="run-title">Running search...</p>
            </div>
            <p id="runSubtitle" class="run-subtitle">Working through candidate tours. Larger runs can take a while.</p>
            <p id="runElapsed" class="run-elapsed">Elapsed: 0.0s</p>
            <div class="run-bar" aria-hidden="true"></div>
          </div>
        </div>

        <div id="status">Initializing...</div>

        <div class="controls">
          <label>
            Iterations
            <input id="iterations" type="number" min="1" max="200000" value="10000" />
          </label>
          <label>
            Threads (1..16)
            <input id="threads" type="number" min="1" max="16" value="4" />
          </label>
          <label>
            Chunk size
            <input id="chunkSize" type="number" min="0" max="1048576" value="0" />
          </label>
          <label>
            Seed
            <input id="seed" type="number" min="1" max="99999999" value="42" />
          </label>
          <label>
            Number of cities
            <input id="numCities" type="number" min="5" max="200" value="50" />
          </label>
        </div>

        <div class="actions">
          <button id="runParallel">Run parallel search</button>
          <button id="runSequential" class="secondary">Run sequential search</button>
          <button id="reset" class="ghost">Reset best tour</button>
        </div>

        <div class="stats">
          <div class="stat"><h3>Best Distance</h3><p id="bestDistance">-</p></div>
          <div class="stat"><h3>Elapsed</h3><p id="elapsed">-</p></div>
          <div class="stat"><h3>Iterations/s</h3><p id="ips">-</p></div>
        </div>

        <canvas id="canvas" width="920" height="430"></canvas>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
