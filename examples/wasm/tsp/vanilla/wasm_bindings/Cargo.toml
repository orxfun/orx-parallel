[package]
name = "wasm_bindings"
version = "0.1.0"
edition = "2024"
publish = ["artifactory"]

[dependencies]
computation = { path = "../computation", features = ["wasm-web-threads"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
