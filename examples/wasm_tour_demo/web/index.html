<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>orx-parallel wasm tour demo</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --ink: #14213d;
        --panel: #ffffff;
        --accent: #0f766e;
        --accent2: #f59e0b;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #eef2ff 0, var(--bg) 55%);
        color: var(--ink);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      main {
        max-width: 980px;
        margin: 32px auto;
        padding: 20px;
      }
      .card {
        position: relative;
        background: var(--panel);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(20, 33, 61, 0.08);
        padding: 16px;
      }
      .run-overlay {
        position: absolute;
        inset: 16px;
        display: none;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.52);
        backdrop-filter: blur(2px);
        z-index: 5;
      }
      .run-overlay.active {
        display: flex;
      }
      .run-overlay-card {
        min-width: 260px;
        max-width: 460px;
        background: #ffffff;
        border: 1px solid #dbe3ef;
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.14);
      }
      .run-overlay-top {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid #d1d5db;
        border-top-color: #0f766e;
        animation: spin 0.9s linear infinite;
      }
      .run-title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
      }
      .run-subtitle {
        margin: 0;
        font-size: 13px;
        color: #334155;
      }
      .run-elapsed {
        margin: 8px 0 0;
        font-size: 12px;
        font-weight: 600;
        color: #475569;
      }
      .run-bar {
        margin-top: 10px;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .run-bar::after {
        content: "";
        display: block;
        width: 35%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #0f766e, #0ea5a1);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        50% {
          transform: translateX(85%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      input {
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 14px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 12px;
        background: linear-gradient(90deg, var(--accent), #0ea5a1);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: linear-gradient(90deg, #2563eb, #4f46e5);
      }
      button.ghost {
        background: #f3f4f6;
        color: #1f2937;
        border: 1px solid #d1d5db;
      }
      #status {
        font-size: 14px;
        min-height: 20px;
        margin-bottom: 10px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 10px;
      }
      .stat {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 8px;
      }
      .stat h3 {
        margin: 0;
        font-size: 12px;
        color: #64748b;
      }
      .stat p {
        margin: 4px 0 0;
        font-size: 16px;
        font-weight: 600;
      }
      canvas {
        width: 100%;
        height: 430px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
      }
      @media (max-width: 760px) {
        .controls {
          grid-template-columns: 1fr;
        }
        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>orx-parallel in browser wasm</h1>
      <p>Find a short tour across hard-coded points by evaluating random permutations in parallel.</p>
      <section class="card">
        <div id="runOverlay" class="run-overlay" aria-live="polite" aria-hidden="true">
          <div class="run-overlay-card">
            <div class="run-overlay-top">
              <span class="spinner" aria-hidden="true"></span>
              <p id="runTitle" class="run-title">Running search...</p>
            </div>
            <p id="runSubtitle" class="run-subtitle">Working through candidate tours. This can take a few minutes for large runs.</p>
            <p id="runElapsed" class="run-elapsed">Elapsed: 0.0s</p>
            <div class="run-bar" aria-hidden="true"></div>
          </div>
        </div>
        <div id="status">Initializing...</div>
        <div class="controls">
          <label>
            Iterations
            <input id="iterations" type="number" min="1" max="200000" value="10000" />
          </label>
          <label>
            Threads
            <input id="threads" type="number" min="1" max="64" value="4" />
          </label>
          <label>
            Seed
            <input id="seed" type="number" min="1" max="99999999" value="42" />
          </label>
          <label>
            Number of Cities
            <input id="numCities" type="number" min="5" max="200" value="30" />
          </label>
        </div>
        <div class="actions">
          <button id="runParallel">Run parallel search</button>
          <button id="runSequential" class="secondary">Run sequential search</button>
          <button id="reset" class="ghost">Reset best tour</button>
        </div>
        <div class="stats">
          <div class="stat"><h3>Best Distance</h3><p id="bestDistance">-</p></div>
          <div class="stat"><h3>Elapsed</h3><p id="elapsed">-</p></div>
          <div class="stat"><h3>Iterations/s</h3><p id="ips">-</p></div>
        </div>
        <canvas id="canvas" width="920" height="430"></canvas>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
