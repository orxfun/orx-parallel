[package]
name = "orx-parallel-wasm-perf-orx"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tsp-core = { package = "orx-parallel-wasm-perf-tsp-core", path = "../tsp_core" }
orx-parallel = { path = "../../../..", features = ["wasm-web-threads"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
