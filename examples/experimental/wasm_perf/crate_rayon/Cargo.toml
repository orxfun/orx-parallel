[package]
name = "orx-parallel-wasm-perf-rayon"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tsp-core = { package = "orx-parallel-wasm-perf-tsp-core", path = "../tsp_core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
rayon = { version = "1.11.0", default-features = false }
wasm-bindgen-rayon = "1.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
